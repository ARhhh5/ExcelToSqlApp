name: Build Windows EXE

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # Throwaway SQL Server for the import integration tests.
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Ci_Test_Passw0rd
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Ci_Test_Passw0rd -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Run tests (mapping + SQL import)
        env:
          TEST_SQL_CONNECTION: Server=localhost,1433;User ID=sa;Password=Ci_Test_Passw0rd;TrustServerCertificate=True
        run: dotnet run --project ExcelToSqlApp.Tests -c Release

  build:
    needs: test
    # WinForms can be cross-compiled on Linux thanks to EnableWindowsTargeting in the csproj.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Publish single-file EXE (win-x64)
        run: >
          dotnet publish ExcelToSqlApp/ExcelToSqlApp.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ExcelToSqlApp-win-x64
          # clients.json must sit next to the .exe at runtime.
          path: |
            publish/ExcelToSqlApp.exe
            publish/clients.json
          if-no-files-found: error
          retention-days: 30
